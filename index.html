<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orçamento da Oficina</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,.15);
}

.cabecalho {
    text-align: center;
    border-bottom: 2px solid #222;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.logo {
    font-size: 42px;
}

.cabecalho h1 {
    margin: 5px 0;
    font-size: 25px;
}

.cabecalho p {
    margin: 0;
    color: #666;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 14px;
    margin-top: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.btn-pdf {
    background: #222;
    color: white;
}

.btn-whatsapp {
    background: #25D366;
    color: white;
}

#status {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="cabecalho">
        <div class="logo">⚙️</div>
        <h1>ORÇAMENTO DE SERVIÇO</h1>
        <p>Oficina Mecânica</p>
    </div>


    <label>Nome do cliente</label>
    <input
        type="text"
        id="cliente"
        placeholder="Digite o nome do cliente"
    >


    <label>Veículo</label>
    <input
        type="text"
        id="veiculo"
        placeholder="Ex.: Chevrolet Onix 1.0 Turbo"
    >


    <label>Placa</label>
    <input
        type="text"
        id="placa"
        placeholder="Digite a placa"
    >


    <label>Serviço a executar</label>
    <textarea
        id="servico"
        placeholder="Digite o serviço que será executado"
    ></textarea>


    <label>Peças utilizadas</label>
    <textarea
        id="pecas"
        placeholder="Digite as peças. Pode colocar uma por linha."
    ></textarea>


    <label>Valor da mão de obra</label>
    <input
        type="number"
        id="maoObra"
        placeholder="Ex.: 350"
        step="0.01"
    >


    <label>Valor das peças</label>
    <input
        type="number"
        id="valorPecas"
        placeholder="Ex.: 580"
        step="0.01"
    >


    <label>Observações</label>
    <textarea
        id="observacoes"
        placeholder="Digite observações, condições ou informações adicionais"
    ></textarea>


    <button class="btn-pdf" onclick="gerarPDF()">
        📄 GERAR PDF
    </button>


    <button class="btn-whatsapp" onclick="compartilharPDF()">
        📲 COMPARTILHAR PDF
    </button>


    <div id="status"></div>

</div>


<script>

function dadosOrcamento() {

    return {
        cliente: document.getElementById("cliente").value.trim(),

        veiculo: document.getElementById("veiculo").value.trim(),

        placa: document.getElementById("placa").value.trim(),

        servico: document.getElementById("servico").value.trim(),

        pecas: document.getElementById("pecas").value.trim(),

        maoObra: document.getElementById("maoObra").value,

        valorPecas: document.getElementById("valorPecas").value,

        observacoes:
            document.getElementById("observacoes").value.trim()
    };
}


function dinheiro(valor) {

    if (!valor || isNaN(valor)) {
        return "R$ 0,00";
    }

    return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}


function gerarPDF() {

    const dados = dadosOrcamento();

    if (!dados.servico) {

        alert("Digite o serviço que será executado.");

        return null;
    }


    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF();


    let y = 20;


    /*
       CABEÇALHO
    */

    pdf.setFont("helvetica", "bold");

    pdf.setFontSize(24);

    pdf.text("⚙", 105, y, {
        align: "center"
    });

    y += 10;


    pdf.setFontSize(18);

    pdf.text(
        "ORÇAMENTO DE SERVIÇO",
        105,
        y,
        { align: "center" }
    );


    y += 12;


    pdf.setLineWidth(0.5);

    pdf.line(15, y, 195, y);


    y += 12;


    /*
       CLIENTE
    */

    pdf.setFontSize(11);

    pdf.setFont("helvetica", "bold");

    pdf.text("CLIENTE", 15, y);

    y += 7;

    pdf.setFont("helvetica", "normal");

    pdf.text(
        dados.cliente || "-",
        15,
        y
    );


    y += 9;


    /*
       VEÍCULO
    */

    pdf.setFont("helvetica", "bold");

    pdf.text("VEÍCULO", 15, y);

    y += 7;

    pdf.setFont("helvetica", "normal");

    pdf.text(
        dados.veiculo || "-",
        15,
        y
    );


    y += 9;


    /*
       PLACA
    */

    pdf.setFont("helvetica", "bold");

    pdf.text("PLACA", 15, y);

    y += 7;

    pdf.setFont("helvetica", "normal");

    pdf.text(
        dados.placa || "-",
        15,
        y
    );


    y += 13;


    /*
       SERVIÇO
    */

    pdf.setFont("helvetica", "bold");

    pdf.text(
        "SERVIÇO A EXECUTAR",
        15,
        y
    );

    y += 7;

    pdf.setFont("helvetica", "normal");

    const linhasServico =
        pdf.splitTextToSize(
            dados.servico,
            175
        );

    pdf.text(
        linhasServico,
        15,
        y
    );

    y +=
        linhasServico.length * 6 +
        12;


    /*
       PEÇAS
    */

    pdf.setFont("helvetica", "bold");

    pdf.text(
        "PEÇAS UTILIZADAS",
        15,
        y
    );

    y += 7;

    pdf.setFont("helvetica", "normal");


    const textoPecas =
        dados.pecas || "Nenhuma peça informada";


    const linhasPecas =
        pdf.splitTextToSize(
            textoPecas,
            175
        );


    pdf.text(
        linhasPecas,
        15,
        y
    );


    y +=
        linhasPecas.length * 6 +
        12;


    /*
       VALORES
    */

    pdf.setFont("helvetica", "bold");

    pdf.text(
        "MÃO DE OBRA",
        15,
        y
    );

    pdf.setFont("helvetica", "normal");

    pdf.text(
        dinheiro(dados.maoObra),
        195,
        y,
        { align: "right" }
    );


    y += 8;


    pdf.setFont("helvetica", "bold");

    pdf.text(
        "PEÇAS",
        15,
        y
    );

    pdf.setFont("helvetica", "normal");

    pdf.text(
        dinheiro(dados.valorPecas),
        195,
        y,
        { align: "right" }
    );


    y += 8;


    const total =
        Number(dados.maoObra || 0) +
        Number(dados.valorPecas || 0);


    pdf.setLineWidth(0.5);

    pdf.line(15, y, 195, y);


    y += 9;


    pdf.setFont("helvetica", "bold");

    pdf.setFontSize(13);

    pdf.text(
        "TOTAL",
        15,
        y
    );


    pdf.text(
        dinheiro(total),
        195,
        y,
        { align: "right" }
    );


    y += 14;


    /*
       OBSERVAÇÕES
    */

    if (dados.observacoes) {

        pdf.setFontSize(11);

        pdf.setFont("helvetica", "bold");

        pdf.text(
            "OBSERVAÇÕES",
            15,
            y
        );


        y += 7;

        pdf.setFont("helvetica", "normal");


        const linhasObs =
            pdf.splitTextToSize(
                dados.observacoes,
                175
            );


        pdf.text(
            linhasObs,
            15,
            y
        );


        y +=
            linhasObs.length * 6 +
            10;
    }


    /*
       RODAPÉ
    */

    pdf.setFontSize(9);

    pdf.setFont("helvetica", "normal");

    pdf.text(
        "Orçamento sujeito à avaliação e confirmação do serviço.",
        105,
        285,
        { align: "center" }
    );


    /*
       NOME DO ARQUIVO
    */

    const nomeCliente =
        (dados.cliente || "Cliente")
        .replace(/[^a-zA-Z0-9À-ÿ ]/g, "")
        .replace(/\s+/g, "_");


    const nomeArquivo =
        "Orcamento_" +
        nomeCliente +
        ".pdf";


    /*
       SALVA O PDF
    */

    pdf.save(nomeArquivo);


    /*
       GUARDA O PDF PARA COMPARTILHAR
    */

    const blob =
        pdf.output("blob");


    document.getElementById("status").innerText =
        "PDF gerado com sucesso!";


    return {
        blob: blob,
        nome: nomeArquivo
    };
}



async function compartilharPDF() {

    const resultado =
        gerarPDF();


    if (!resultado) {
        return;
    }


    const arquivo =
        new File(
            [resultado.blob],
            resultado.nome,
            {
                type: "application/pdf"
            }
        );


    /*
       COMPARTILHAMENTO NATIVO DO CELULAR
    */

    if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
            files: [arquivo]
        })
    ) {

        try {

            await navigator.share({

                title: "Orçamento",

                text:
                    "Orçamento de serviço",

                files: [arquivo]

            });


            document.getElementById("status").innerText =
                "Compartilhamento aberto.";

        }

        catch (erro) {

            if (
                erro.name !== "AbortError"
            ) {

                alert(
                    "Não foi possível compartilhar o PDF."
                );

            }

        }

    }

    else {

        alert(
            "O navegador não permite o compartilhamento direto. " +
            "O PDF foi salvo no celular. " +
            "Abra o arquivo e use a opção Compartilhar para enviar pelo WhatsApp."
        );

    }

}

</script>

</body>
</html>
