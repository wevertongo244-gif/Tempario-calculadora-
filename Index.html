<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempario - Calculadora de Mão de Obra</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .resultado {
      margin-top: 25px;
      padding: 18px;
      background: #eee;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      margin-top: 20px;
      padding: 12px;
      background: #f8f8f8;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Tempario</h1>

    <div class="subtitulo">
      Calculadora de Mão de Obra
    </div>

    <label for="horas">
      Horas de serviço
    </label>

    <input
      type="number"
      id="horas"
      min="0"
      step="0.5"
      placeholder="Ex.: 2"
    >

    <label for="minutos">
      Minutos adicionais
    </label>

    <input
      type="number"
      id="minutos"
      min="0"
      max="59"
      step="1"
      placeholder="Ex.: 30"
    >

    <button onclick="calcular()">
      CALCULAR
    </button>

    <div class="resultado" id="resultado">
      Valor: R$ 0,00
    </div>

    <div class="info">
      Valor da mão de obra: R$ 120,00 por hora.
      <br>
      Equivale a R$ 2,00 por minuto.
    </div>

  </div>

  <script>

    function calcular() {

      let horas = Number(document.getElementById("horas").value) || 0;

      let minutos = Number(document.getElementById("minutos").value) || 0;

      let totalMinutos = (horas * 60) + minutos;

      let valor = totalMinutos * 2;

      let valorFormatado = valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });

      document.getElementById("resultado").innerHTML =
        "Valor: " + valorFormatado;
    }

  </script>

</body>
</html>
